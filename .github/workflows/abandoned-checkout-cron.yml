name: Abandoned checkout cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  process-abandoned-checkouts:
    runs-on: ubuntu-latest
    steps:
      - name: Call abandoned-checkout endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add GitHub secrets APP_BASE_URL and CRON_SECRET, then rerun."
            exit 1
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${APP_BASE_URL%/}/api/cron/abandoned-checkout"
